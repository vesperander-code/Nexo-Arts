<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexo Arts - Design que Destaca</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
    body { background: #050505; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; }
    
    #btn-musica {
      position: fixed; top: 20px; right: 20px; z-index: 999;
      background: #8b5cf6; color: #fff; border: none;
      padding: 10px 16px; border-radius: 50px; cursor: pointer;
      font-weight: bold; font-size: 0.9em; /* DIMINUI AQUI */
    }
    
    header {
      text-align: center; padding: 80px 20px; /* DIMINUI O ESPAÇO TAMBÉM */
      background: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 50%, #22c55e 100%);
    }
    header h1 { font-size: 2.8em; margin-bottom: 10px; letter-spacing: 3px; } /* ERA 3.5em */
    header p { font-size: 1.1em; opacity: 0.95; } /* ERA 1.3em */
    
    .btn-whats {
      display: inline-block; margin-top: 20px; padding: 14px 30px;
      background: #22c55e; color: #fff; text-decoration: none;
      border-radius: 50px; font-weight: bold; font-size: 1em; /* ERA 1.1em */
    }
    
    .container { max-width: 1200px; margin: 0 auto; padding: 50px 20px; }
    h2 { text-align: center; font-size: 2em; margin-bottom: 40px; color: #8b5cf6; } /* ERA 2.5em */
    
    .galeria { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
    .card { background: #111; border-radius: 20px; overflow: hidden; border: 1px solid #222; }
    .card img { width: 100%; height: 260px; object-fit: cover; } /* DIMINUI A IMAGEM TAMBÉM */
    .card-info { padding: 18px; text-align: center; }
    .card-info h3 { color: #22c55e; margin-bottom: 8px; font-size: 1.2em; } /* ERA 1.4em */
    .card-info p { color: #aaa; font-size: 0.95em; } /* FONTE DA DESCRIÇÃO MENOR */
  </style>
</head>
<body>
  <button id="btn-musica" onclick="toggleMusica()">🔊 Música</button>
  <audio id="musica" loop><source src="musica.mp3" type="audio/mpeg"></audio>

  <header>
    <h1>NEXO ARTS</h1>
    <p>Design com IA que faz seu negócio se destacar</p>
    <a href="https://wa.me/5513985997618" class="btn-whats">💬 Fale comigo no WhatsApp</a>
  </header>

  <div class="container">
    <h2>Portfólio</h2>
    <div class="galeria">
      <div class="card"><img src="futebol.jpg"><div class="card-info"><h3>NEXO CUP 2026</h3><p>Pôster Esportivo</p></div></div>
      <div class="card"><img src="campeonato.jpg"><div class="card-info"><h3>Campeonato</h3><p>Arte Esportiva</p></div></div>
      <div class="card"><img src="games.jpg"><div class="card-info"><h3>Thumbnail Gamer</h3><p>Cheguei no Level Máximo</p></div></div>
      <div class="card"><img src="social.jpg"><div class="card-info"><h3>BRASA BURGER</h3><p>Social Media - Combo</p></div></div>
      <div class="card"><img src="wallpaper.jpg"><div class="card-info"><h3>Wallpaper Gamer</h3><p>Cidade Futurista</p></div></div>
      <div class="card"><img src="produto.jpg"><div class="card-info"><h3>NEXO RUN</h3><p>Foto de Produto</p></div></div>
    </div>
  </div>

  <script>
    const musica = document.getElementById('musica'); musica.volume = 0.1;
    let tocando = false; 
    function toggleMusica() { 
      if (tocando) { musica.pause(); btn.innerText = '🔇 Música'; } 
      else { musica.play(); btn.innerText = '🔊 Música'; } 
      tocando = !tocando; 
    }
  </script>
</body>
</html>
